<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-label="wisirc: IRC in your terminal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/><stop offset="1" stop-color="#4fc3d9"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="958" height="258" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <circle cx="30" cy="28" r="6" fill="#ff5f57"/><circle cx="50" cy="28" r="6" fill="#febc2e"/><circle cx="70" cy="28" r="6" fill="#28c840"/>
  <text x="480" y="33" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8b949e">wisirc — ~/irc</text>
  <line x1="1" y1="50" x2="959" y2="50" stroke="#30363d" stroke-width="1"/>
  <text x="56" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="76" font-weight="700" fill="url(#glow)" letter-spacing="2">wisirc</text>
  <text x="58" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#e6edf3">IRC in your terminal: mouse, menus, themes and a live dashboard</text>
  <text x="58" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#8b949e"><tspan fill="#3fb950">[you]</tspan> &gt; /join <tspan fill="#ff8fc8">#wisirc</tspan><tspan fill="#e6edf3">▌</tspan></text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#8b949e" text-anchor="end">
    <text x="904" y="96"><tspan fill="#3fb950">●</tspan> libera   12ms</text>
    <text x="904" y="120"><tspan fill="#3fb950">●</tspan> oftc     38ms</text>
    <text x="904" y="144"><tspan fill="#4fc3d9">◌</tspan> darkstar  …</text>
  </g>
  <g fill="#3fb950" opacity="0.85">
    <rect x="770" y="216" width="10" height="10" rx="2"/><rect x="784" y="210" width="10" height="16" rx="2"/>
    <rect x="798" y="204" width="10" height="22" rx="2"/><rect x="812" y="212" width="10" height="14" rx="2"/>
    <rect x="826" y="200" width="10" height="26" rx="2"/><rect x="840" y="208" width="10" height="18" rx="2"/>
    <rect x="854" y="214" width="10" height="12" rx="2"/><rect x="868" y="206" width="10" height="20" rx="2"/>
    <rect x="882" y="210" width="10" height="16" rx="2"/><rect x="896" y="202" width="10" height="24" rx="2"/>
  </g>
</svg>
